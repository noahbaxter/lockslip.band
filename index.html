<!DOCTYPE html>
<!-- data-accent names the record whose colour the page is wearing. The value here
     is the no-JS fallback. -->
<html lang="en" data-accent="the-conversation">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lockslip</title>
    <script>
        /* The site accent follows the record open in MUSIC (see variables.css).
           Inline and ahead of the stylesheet so a return visit never paints a
           frame in the previous record's colour. Set ACCENT_PIN to an accent id
           to force one colour for good; null follows whatever is open. */
        window.ACCENT_PIN = null;
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('accent-release'); } catch (e) {}
            var id = window.ACCENT_PIN || saved;
            if (id) document.documentElement.dataset.accent = id;
        })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon.png">
    <link rel="apple-touch-icon" href="assets/icons/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="js/components/platform-icons.js"></script>
    <script src="js/components/navigation.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/news.js"></script>
    <script src="js/components/audio-player.js"></script>
    <script src="js/components/releases.js"></script>
    <script src="js/components/now-playing.js"></script>
    <script src="js/components/merchandise.js"></script>
    <script src="js/components/media.js"></script>
    <script src="js/components/extras.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/components/shows-processor.js"></script>
    <script src="js/components/shows/shows-card.js"></script>
    <script src="js/components/shows/shows-carousel.js"></script>
    <script src="js/components/shows/shows-poster-grid.js"></script>
    <script src="js/components/shows/shows-table.js"></script>
    <script src="js/components/shows/shows-list.js"></script>
    <script src="js/components/shows/shows-scroll-nav.js"></script>
    <script src="js/components/shows/shows.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/poster-modal.js"></script>
    <script src="js/components/photo-modal.js"></script>
    <script src="js/components/artwork-modal.js"></script>
    <script src="js/components/news-modal.js"></script>
    <script src="js/components/carousel-manager.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/image-loader.js"></script>
    <script src="js/components/press.js"></script>
    <script src="js/press-loader.js"></script>
    <script src="js/content-loader.js"></script>
    <script src="js/plugin-loader.js"></script>
    <script src="js/router.js"></script>
</head>
<body>

    <main>
        <section id="news">
            <!-- Content loaded dynamically by content-loader.js -->
        </section>

        <section id="music">
            <!-- Content loaded dynamically by content-loader.js -->
        </section>

        <section id="shows">
            <!-- Content loaded dynamically by content-loader.js -->
        </section>

        <section id="store">
            <!-- Content loaded dynamically by content-loader.js -->
        </section>

        <section id="extras">
            <!-- Content loaded dynamically by content-loader.js -->
        </section>
    </main>

    <!-- Footer is built once by FooterComponent.init, shared across all pages. -->
</body>
</html>
